name: CI

# 这个仓库没有第三方构建依赖，CI 只需要 node。跑四件事，每一件都对应一个
# 「本地能过、线上却坏掉」的真实场景：
#   build      —— src/*.js 内联进模板；模板或源码改动忘了构建时先炸在这里
#   check      —— 产物是拼出来的共享作用域，语法错误必须在发布前发现
#   test       —— 纯逻辑单测 + 「committed 产物 == 新鲜构建」的一致性断言
#   pack dryrun —— 发布脚本的目标仓库 / 版本 / 产物名全部从 package.json 派生，
#                dry-run 能在不写远端的前提下确认这套派生还成立
on:
  push:
  pull_request:

jobs:
  build-and-test:
    # 两个平台都跑：产物是「构建期拼接 + 逐字比对」，EOL 处理错一次就会让另一个
    # 平台的 committed-bundle 检查误报（历史上 Windows 构建比 Linux 多 2 个空行）。
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build client bundle
        run: node scripts/build.mjs

      - name: Syntax-check the bundle and the host entry
        # package.json 的 main / exports["."] 指向 lib/index.js —— DSH loader 真正
        # import 的入口。只查 lib/client.js 时，写坏入口也能全绿发布（审查 P1-1）。
        run: node --check lib/client.js && node --check lib/index.js

      - name: Unit tests
        run: npm test

      - name: Verify packed tarball contents
        # 发布产物必须真的包含运行期文件（lib/*、cordis.patch.yml、两份 README）。
        # 只跑 `npm pack` 不检查清单时，package.json.files 少一项也会全绿，
        # 直到用户安装 / DSH 组合 bundle 时才炸。
        run: node scripts/verify-pack.mjs

      - name: Fail if the committed bundle is stale
        # 单测里已有同样的逐字比对，这里是第二道更直白的门：上一步刚构建过，
        # 工作区还出 diff 就说明提交里的 lib/client.js 不是由当前 src/ 模板产生的。
        run: git diff --exit-code -- lib/client.js

      - name: "Release plan (dry run: packs the artifact, writes nothing remote)"
        # 发布脚本的目标仓库 / 版本 / tag / 产物名全部从 package.json 派生；
        # --dry-run 会在取凭据之前退出，所以这里既验证派生也验证产物前置条件。
        run: |
          npm pack --silent
          node scripts/release-code-nav.mjs --dry-run
